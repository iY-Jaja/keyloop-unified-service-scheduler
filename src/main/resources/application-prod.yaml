spring:
  application:
    name: service-scheduler
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/service_scheduler}"
    username: "${DB_USERNAME:scheduler}"
    password: "${DB_PASSWORD:}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    locations: classpath:db/migration
  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: [health, info, metrics]
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.keyloop.scheduler: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n"
