spring:
  application:
    name: service-scheduler
  mvc:
    async:
      request-timeout: 30s
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/service_scheduler}"
    username: "${DB_USERNAME:scheduler}"
    password: "${DB_PASSWORD:}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    locations: classpath:db/migration,classpath:db/demo
  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-message: never
  tomcat:
    connection-timeout: 5s
    threads:
      max: 50
      min-spare: 10
    max-connections: 200
    accept-count: 50

management:
  endpoints:
    web:
      exposure:
        include: [health, info, metrics]
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.keyloop.scheduler: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n"
