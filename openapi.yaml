openapi: 3.0.3
info:
  title: Unified Service Scheduler API
  version: 1.0.0
  description: >
    REST API for querying service catalog and dealership resources,
    booking vehicle service appointments, and retrieving appointments.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Appointments
    description: Book and query service appointments
  - name: Reference data
    description: Service catalog and dealership resources
paths:
  /api/v1/appointments:
    post:
      tags:
        - Appointments
      summary: Book a service appointment
      description: >
        Checks the full service interval for an available bay and qualified
        technician, then persists a confirmed appointment. Repeating an
        identical request with the same Idempotency-Key replays the original
        appointment. Reusing the key with a different request returns a
        conflict.
      operationId: createAppointment
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Key used to safely retry the same booking request.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
            example:
              dealershipId: dealer-1
              customerId: customer-1
              vehicleId: vehicle-1
              serviceTypeId: oil-change
              startAt: '2027-01-16T10:00:00+07:00'
      responses:
        '201':
          description: Appointment created or original appointment replayed.
          headers:
            Location:
              description: URI of the created or replayed appointment.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Vehicle, service bay, technician, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                vehicleAlreadyBooked:
                  summary: Vehicle has an overlapping confirmed appointment.
                  value:
                    code: VEHICLE_ALREADY_BOOKED
                    message: The vehicle already has an appointment for this time.
                slotUnavailable:
                  summary: No bay or qualified technician is available.
                  value:
                    code: SLOT_UNAVAILABLE
                    message: No suitable service resources are available for this time.
                idempotencyKeyReused:
                  summary: Key was previously used with a different request.
                  value:
                    code: IDEMPOTENCY_KEY_REUSED
                    message: The idempotency key was already used for a different request.
    get:
      tags:
        - Appointments
      summary: List appointments
      operationId: listAppointments
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of results per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page of appointments sorted by start time and ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/v1/appointments/{appointmentId}:
    get:
      tags:
        - Appointments
      summary: Get an appointment
      operationId: getAppointment
      parameters:
        - name: appointmentId
          in: path
          required: true
          description: Identifier of the appointment.
          schema:
            type: string
      responses:
        '200':
          description: Appointment details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/service-types:
    get:
      tags:
        - Reference data
      summary: List service types
      operationId: listServiceTypes
      responses:
        '200':
          description: Available service types and their durations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceTypeResponse'
  /api/v1/dealerships/{dealershipId}/resources:
    get:
      tags:
        - Reference data
      summary: List dealership resources
      operationId: getDealershipResources
      parameters:
        - name: dealershipId
          in: path
          required: true
          description: Identifier of the dealership.
          schema:
            type: string
      responses:
        '200':
          description: Service bays and technicians at the dealership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSummary'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    InvalidRequest:
      description: Request body, header, or query parameter is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INVALID_REQUEST
            message: Request validation failed.
    NotFound:
      description: A referenced dealership, customer, vehicle, service type, or appointment was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: Appointment not found.
  schemas:
    BookingRequest:
      type: object
      required:
        - dealershipId
        - customerId
        - vehicleId
        - serviceTypeId
        - startAt
      properties:
        dealershipId:
          type: string
          minLength: 1
          maxLength: 64
          description: Must not be blank.
        customerId:
          type: string
          minLength: 1
          maxLength: 64
          description: Must not be blank.
        vehicleId:
          type: string
          minLength: 1
          maxLength: 64
          description: Must not be blank.
        serviceTypeId:
          type: string
          minLength: 1
          maxLength: 64
          description: Must not be blank.
        startAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp with an offset; normalized to UTC.
    AppointmentResponse:
      type: object
      required:
        - id
        - dealershipId
        - customerId
        - vehicleId
        - serviceTypeId
        - serviceBayId
        - technicianId
        - startAt
        - endAt
        - status
      properties:
        id:
          type: string
        dealershipId:
          type: string
        customerId:
          type: string
        vehicleId:
          type: string
        serviceTypeId:
          type: string
        serviceBayId:
          type: string
        technicianId:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - CONFIRMED
    AppointmentPage:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
        - first
        - last
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
    ServiceTypeResponse:
      type: object
      required:
        - id
        - name
        - durationMinutes
      properties:
        id:
          type: string
        name:
          type: string
        durationMinutes:
          type: integer
    ResourceSummary:
      type: object
      required:
        - dealershipId
        - serviceBays
        - technicians
      properties:
        dealershipId:
          type: string
        serviceBays:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        technicians:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
    Resource:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - NOT_FOUND
            - SLOT_UNAVAILABLE
            - VEHICLE_ALREADY_BOOKED
            - IDEMPOTENCY_KEY_REUSED
        message:
          type: string
